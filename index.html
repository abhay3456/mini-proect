<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
    }

    header {
      background-color: #2e7d32;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    header p {
      font-size: 13px;
      opacity: 0.85;
    }

    .container {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* top 3 cards */
    .cards {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      flex: 1;
      background: white;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .card p {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .card h2 {
      font-size: 24px;
    }

    .card.balance h2 { color: #1565c0; }
    .card.income  h2 { color: #2e7d32; }
    .card.expense h2 { color: #c62828; }

    /* main layout */
    .main-layout {
      display: flex;
      gap: 20px;
    }

    /* form */
    .form-box {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      width: 320px;
      flex-shrink: 0;
      height: fit-content;
    }

    .form-box h3 {
      margin-bottom: 16px;
      font-size: 16px;
      color: #2e7d32;
      border-bottom: 2px solid #2e7d32;
      padding-bottom: 8px;
    }

    .type-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .type-btns button {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    .type-btns button.selected-income {
      background: #e8f5e9;
      border-color: #2e7d32;
      color: #2e7d32;
    }

    .type-btns button.selected-expense {
      background: #ffebee;
      border-color: #c62828;
      color: #c62828;
    }

    .form-box label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .form-box input,
    .form-box select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .form-box input:focus,
    .form-box select:focus {
      border-color: #2e7d32;
    }

    .add-btn {
      width: 100%;
      padding: 11px;
      margin-top: 16px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:hover {
      background-color: #1b5e20;
    }

    .add-btn.red {
      background-color: #c62828;
    }

    .add-btn.red:hover {
      background-color: #b71c1c;
    }

    /* right side */
    .right-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* transaction list */
    .list-box {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .list-header h3 {
      font-size: 16px;
      color: #333;
    }

    .filter-btns {
      display: flex;
      gap: 6px;
    }

    .filter-btns button {
      padding: 4px 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      background: white;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-btns button.active {
      background: #2e7d32;
      color: white;
      border-color: #2e7d32;
    }

    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .tx-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
      gap: 12px;
    }

    .tx-emoji {
      font-size: 20px;
      width: 36px;
      text-align: center;
    }

    .tx-info {
      flex: 1;
    }

    .tx-info span {
      display: block;
    }

    .tx-name {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .tx-cat {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .tx-amount {
      font-size: 15px;
      font-weight: bold;
    }

    .tx-amount.plus  { color: #2e7d32; }
    .tx-amount.minus { color: #c62828; }

    .del-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
    }

    .del-btn:hover { color: #c62828; }

    .no-data {
      text-align: center;
      color: #aaa;
      padding: 30px 0;
      font-size: 14px;
    }

    /* simple bar chart */
    .chart-box {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .chart-box h3 {
      font-size: 16px;
      color: #333;
      margin-bottom: 16px;
    }

    .chart-area {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      height: 120px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      height: 100%;
    }

    .bar-col .bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      min-height: 3px;
    }

    .bar-col .bar.green { background-color: #66bb6a; }
    .bar-col .bar.red   { background-color: #ef5350; }

    .bar-col .blabel {
      font-size: 10px;
      color: #999;
      text-align: center;
      word-break: break-word;
    }

    .chart-legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }

    .chart-legend span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    /* error message */
    .error-msg {
      color: #c62828;
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }

    @media (max-width: 680px) {
      .cards { flex-direction: column; }
      .main-layout { flex-direction: column; }
      .form-box { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>💰 Expense Tracker</h1>
  <p id="todayDate"></p>
</header>

<div class="container">

  <!-- balance, income, expense cards -->
  <div class="cards">
    <div class="card balance">
      <p>Net Balance</p>
      <h2 id="totalBalance">₹0.00</h2>
    </div>
    <div class="card income">
      <p>Total Income</p>
      <h2 id="totalIncome">₹0.00</h2>
    </div>
    <div class="card expense">
      <p>Total Expense</p>
      <h2 id="totalExpense">₹0.00</h2>
    </div>
  </div>

  <div class="main-layout">

    <!-- add transaction form -->
    <div class="form-box">
      <h3>Add Transaction</h3>

      <div class="type-btns">
        <button id="incBtn" class="selected-income" onclick="switchType('income')">⬆ Income</button>
        <button id="expBtn" onclick="switchType('expense')">⬇ Expense</button>
      </div>

      <label>Description</label>
      <input type="text" id="desc" placeholder="e.g. Salary, Rent..." />

      <label>Amount (₹)</label>
      <input type="number" id="amount" placeholder="Enter amount" min="1" />

      <label>Category</label>
      <select id="category">
        <option value="">-- Select --</option>
        <optgroup label="Income">
          <option>💼 Salary</option>
          <option>🎁 Gift</option>
          <option>📦 Business</option>
          <option>💹 Investment</option>
          <option>🔁 Other Income</option>
        </optgroup>
        <optgroup label="Expense">
          <option>🛒 Groceries</option>
          <option>🍔 Food & Dining</option>
          <option>🚌 Transport</option>
          <option>🏠 Rent</option>
          <option>🎮 Entertainment</option>
          <option>💊 Healthcare</option>
          <option>📚 Education</option>
          <option>🛍️ Shopping</option>
          <option>💸 Other</option>
        </optgroup>
      </select>

      <label>Date</label>
      <input type="date" id="date" />

      <p class="error-msg" id="errMsg">Please fill all fields correctly.</p>

      <button class="add-btn" id="addBtn" onclick="addTransaction()">+ Add Income</button>
    </div>

    <!-- right side: chart + list -->
    <div class="right-side">

      <!-- chart -->
      <div class="chart-box">
        <h3>📊 Spending by Category</h3>
        <div class="chart-area" id="chartArea">
          <p style="color:#aaa; font-size:13px;">No data yet</p>
        </div>
        <div class="chart-legend">
          <span><div class="dot" style="background:#66bb6a;"></div> Income</span>
          <span><div class="dot" style="background:#ef5350;"></div> Expense</span>
        </div>
      </div>

      <!-- transaction list -->
      <div class="list-box">
        <div class="list-header">
          <h3>Transactions</h3>
          <div class="filter-btns">
            <button class="active" onclick="filterList('all', this)">All</button>
            <button onclick="filterList('income', this)">Income</button>
            <button onclick="filterList('expense', this)">Expense</button>
          </div>
        </div>
        <div class="tx-list" id="txList">
          <div class="no-data">No transactions added yet.</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // store all transactions here
  var transactions = [];
  var currentType = "income";
  var currentFilter = "all";

  // load saved data from localStorage if any
  if (localStorage.getItem("myTransactions")) {
    transactions = JSON.parse(localStorage.getItem("myTransactions"));
  }

  // show today's date in header
  var today = new Date();
  document.getElementById("todayDate").innerText = today.toDateString();

  // set today's date as default in the date input
  var yyyy = today.getFullYear();
  var mm = String(today.getMonth() + 1).padStart(2, "0");
  var dd = String(today.getDate()).padStart(2, "0");
  document.getElementById("date").value = yyyy + "-" + mm + "-" + dd;

  // switch between income and expense
  function switchType(type) {
    currentType = type;

    var incBtn = document.getElementById("incBtn");
    var expBtn = document.getElementById("expBtn");
    var addBtn = document.getElementById("addBtn");

    if (type === "income") {
      incBtn.className = "selected-income";
      expBtn.className = "";
      addBtn.innerText = "+ Add Income";
      addBtn.className = "add-btn";
    } else {
      incBtn.className = "";
      expBtn.className = "selected-expense";
      addBtn.innerText = "+ Add Expense";
      addBtn.className = "add-btn red";
    }
  }

  // add new transaction
  function addTransaction() {
    var desc = document.getElementById("desc").value.trim();
    var amount = parseFloat(document.getElementById("amount").value);
    var category = document.getElementById("category").value;
    var date = document.getElementById("date").value;
    var errMsg = document.getElementById("errMsg");

    // basic validation
    if (desc === "" || isNaN(amount) || amount <= 0 || category === "" || date === "") {
      errMsg.style.display = "block";
      return;
    }

    errMsg.style.display = "none";

    // create transaction object
    var newTx = {
      id: Date.now(),
      type: currentType,
      desc: desc,
      amount: amount,
      category: category,
      date: date
    };

    // add to array and save
    transactions.unshift(newTx);
    saveToStorage();
    updateUI();

    // clear the form
    document.getElementById("desc").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("category").value = "";
  }

  // delete a transaction by id
  function deleteTransaction(id) {
    transactions = transactions.filter(function(tx) {
      return tx.id !== id;
    });
    saveToStorage();
    updateUI();
  }

  // filter: all / income / expense
  function filterList(type, btn) {
    currentFilter = type;
    var allBtns = document.querySelectorAll(".filter-btns button");
    allBtns.forEach(function(b) { b.className = ""; });
    btn.className = "active";
    renderList();
  }

  // save to localStorage
  function saveToStorage() {
    localStorage.setItem("myTransactions", JSON.stringify(transactions));
  }

  // format number as rupees
  function formatRupee(num) {
    return "₹" + num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  // update everything on screen
  function updateUI() {
    updateCards();
    renderList();
    renderChart();
  }

  // update the 3 summary cards
  function updateCards() {
    var totalIncome = 0;
    var totalExpense = 0;

    transactions.forEach(function(tx) {
      if (tx.type === "income") {
        totalIncome += tx.amount;
      } else {
        totalExpense += tx.amount;
      }
    });

    var balance = totalIncome - totalExpense;

    document.getElementById("totalBalance").innerText = formatRupee(balance);
    document.getElementById("totalIncome").innerText = formatRupee(totalIncome);
    document.getElementById("totalExpense").innerText = formatRupee(totalExpense);
  }

  // render transaction list
  function renderList() {
    var listDiv = document.getElementById("txList");
    var filtered = transactions;

    if (currentFilter !== "all") {
      filtered = transactions.filter(function(tx) {
        return tx.type === currentFilter;
      });
    }

    if (filtered.length === 0) {
      listDiv.innerHTML = '<div class="no-data">No transactions found.</div>';
      return;
    }

    var html = "";
    filtered.forEach(function(tx) {
      var emoji = tx.category.split(" ")[0];
      var sign = tx.type === "income" ? "+" : "-";
      var colorClass = tx.type === "income" ? "plus" : "minus";

      // format date nicely
      var txDate = new Date(tx.date);
      var dateStr = txDate.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });

      html += '<div class="tx-item">';
      html += '<div class="tx-emoji">' + emoji + '</div>';
      html += '<div class="tx-info">';
      html += '<span class="tx-name">' + tx.desc + '</span>';
      html += '<span class="tx-cat">' + tx.category.slice(tx.category.indexOf(" ") + 1) + ' · ' + dateStr + '</span>';
      html += '</div>';
      html += '<span class="tx-amount ' + colorClass + '">' + sign + formatRupee(tx.amount) + '</span>';
      html += '<button class="del-btn" onclick="deleteTransaction(' + tx.id + ')">✕</button>';
      html += '</div>';
    });

    listDiv.innerHTML = html;
  }

  // render the bar chart
  function renderChart() {
    var chartDiv = document.getElementById("chartArea");

    if (transactions.length === 0) {
      chartDiv.innerHTML = '<p style="color:#aaa; font-size:13px;">No data yet</p>';
      return;
    }

    // group by category
    var groups = {};
    transactions.forEach(function(tx) {
      if (!groups[tx.category]) {
        groups[tx.category] = { income: 0, expense: 0 };
      }
      if (tx.type === "income") {
        groups[tx.category].income += tx.amount;
      } else {
        groups[tx.category].expense += tx.amount;
      }
    });

    var keys = Object.keys(groups).slice(0, 6);

    // find max value for scaling bars
    var maxVal = 1;
    keys.forEach(function(k) {
      if (groups[k].income > maxVal) maxVal = groups[k].income;
      if (groups[k].expense > maxVal) maxVal = groups[k].expense;
    });

    var html = "";
    keys.forEach(function(k) {
      var incH = Math.round((groups[k].income / maxVal) * 100);
      var expH = Math.round((groups[k].expense / maxVal) * 100);
      var shortName = k.split(" ").slice(1, 2).join(" ");

      html += '<div class="bar-col">';
      if (groups[k].income > 0) {
        html += '<div class="bar green" style="height:' + incH + 'px;"></div>';
      }
      if (groups[k].expense > 0) {
        html += '<div class="bar red" style="height:' + expH + 'px;"></div>';
      }
      html += '<div class="blabel">' + shortName + '</div>';
      html += '</div>';
    });

    chartDiv.innerHTML = html;
  }

  // run on page load
  updateUI();
</script>

</body>
</html>
